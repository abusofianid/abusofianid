name: Update GitHub Stats

on:
  schedule:
    # Daily at 00:00 UTC (08:00 WITA)
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-stats
  cancel-in-progress: false

jobs:
  update-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate all-time stats from GitHub API
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          GITHUB_USERNAME: abusofianid
        run: python scripts/update_stats.py

      - name: Validate generated SVG files
        run: |
          set -euo pipefail
          for file in github-stats.svg github-top-langs.svg github-stats-dark.svg github-stats-light.svg github-top-langs-dark.svg github-top-langs-light.svg; do
            test -s "$file"
            grep -q '<svg' "$file"
          done
          git diff --check

      - name: Commit and push changed cards
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-stats.svg github-top-langs.svg github-stats-dark.svg github-stats-light.svg github-top-langs-dark.svg github-top-langs-light.svg
          if git diff --cached --quiet; then
            echo "Stats have not changed; nothing to commit."
            exit 0
          fi
          git commit -m "Update all-time GitHub stats cards"
          git push
